name: Assessment validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check PowerShell syntax
        run: ./tests/Test-PowerShellSyntax.ps1
      - name: Check documentation links
        run: python tools/check_docs.py
      - name: Run regression tests with synthetic evidence and mocked tenant access
        run: python -m unittest discover -s tests
      - name: Generate and audit synthetic HTML and workbook
        run: python tools/validate_offline_report.py
